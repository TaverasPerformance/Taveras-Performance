let phaseState = readPhases();

function readPhases() {
  try {
    const stored = JSON.parse(localStorage.getItem(phaseKey) || 'null');
    if (stored?.phases?.length) {
      const phases = new Map(stored.phases.map(phase => [phase.id, phase]));
      for (const preset of builtInPhases) {
        const existing = phases.get(preset.id);
        phases.set(preset.id, existing ? {
          ...existing,
          name: existing.id === 'phase-1' && existing.name === 'Phase 1' ? preset.name : existing.name,
          workouts: {...preset.workouts, ...existing.workouts},
        } : preset);
      }
      return {...stored, phases: [...phases.values()]};
    }
  } catch {
    // The default phase is available if there is no saved plan.
  }
  return {activeId: builtInPhases[0].id, phases: builtInPhases};
}

function currentPhase() {
  return phaseState.phases.find(phase => phase.id === phaseState.activeId) ?? phaseState.phases[0];
}

function savePhases(next) {
  localStorage.setItem(phaseKey, JSON.stringify(next));
  phaseState = next;
}

function updatePhases(next, message = '') {
  try {
    savePhases(next);
  } catch {
    $('phase-status').textContent = 'Could not save this phase. Check your browser storage and try again.';
    return;
  }
  renderToday();
  $('phase-status').textContent = message;
}

  const phase = currentPhase();
  $('phase-select').addEventListener('change', event => {

  });
  $('phase-form').addEventListener('submit', event => {
    event.preventDefault();
    const name = $('phase-name').value.trim();
    if (!name) {
      $('phase-status').textContent = 'Enter a phase name.';
      return;
    }
    const id = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString() + Math.random();
    updatePhases({activeId: id, phases: [...phaseState.phases, {id, name, workouts: phase.workouts}]});
  });
  $('strength-form').addEventListener('submit', event => {
    event.preventDefault();
    const workout = $('strength-workout').value.split('\n').map(line => {
      const [name, target = '', unit = '', block = ''] = line.split('|').map(part => part.trim());
      return {name, target, unit, block};
    }).filter(item => item.name);
    if (workout.some(item => !['', 'lb', 'reps', 'sec', 'yd', 'lb-yd', 'done'].includes(item.unit))) {
      $('phase-status').textContent = 'Use lb, reps, sec, yd, lb-yd, or done in the third column.';
      return;
    }
    if (workout.some(item => item.name.length > 80)) {
      $('phase-status').textContent = 'Keep each exercise name to 80 characters or fewer.';
      return;
    }
    const updated = {...phase, workouts: {...phase.workouts, [day.value]: workout}};
    updatePhases({...phaseState, phases: phaseState.phases.map(item => item.id === phase.id ? updated : item)}, 'Workout saved.');
  });
}

function importPhases(value) {
  if (!Array.isArray(value?.phases)) return;
  const restored = value.phases.slice(0, 200).flatMap(phase => {
    if (typeof phase?.id !== 'string' || typeof phase.name !== 'string' || !phase.workouts || typeof phase.workouts !== 'object') return [];
    const workouts = Object.fromEntries(DAYS.flatMap(day => {
      const items = phase.workouts[day];
      if (!Array.isArray(items)) return [];
      return [[day, items.slice(0, 100).flatMap(item => (
        typeof item?.name === 'string' && item.name.trim() && typeof item.target === 'string'
          ? [{name: item.name.trim().slice(0, 80), target: item.target.slice(0, 250), unit: ['lb', 'reps', 'sec', 'yd', 'lb-yd', 'done'].includes(item.unit) ? item.unit : '', block: typeof item.block === 'string' ? item.block.slice(0, 100) : ''}] : []
      ))]];
    }));
    return [{id: phase.id, name: phase.name.slice(0, 48), workouts}];
  });
  const current = readPhases();
  const phases = new Map(current.phases.map(phase => [phase.id, phase]));
  for (const phase of restored) {
    const preset = builtInPhases.find(item => item.id === phase.id);
    if (!phases.has(phase.id) || preset) {
      const existing = phases.get(phase.id);
      const workouts = Object.fromEntries(Object.entries(phase.workouts).filter(([day]) =>
        !existing?.workouts[day] || JSON.stringify(existing.workouts[day]) === JSON.stringify(preset?.workouts[day])
      ));
      phases.set(phase.id, existing ? {...existing, workouts: {...existing.workouts, ...workouts}} : phase);
    }
  }
  savePhases({activeId: current.activeId, phases: [...phases.values()]});
}

function planExercises() {
  const items = plans[athlete.value][day.value].items.map(item => item.split(' · '));
  if (athlete.value === 'sr' && speed.includes(day.value)) {
    items.push(['Speed session', 'Warm-up, acceleration drills, and short sprints with full recovery. Stop if mechanics decline.']);
  }
  const training = items.map(([name, target]) => ({
    name, target, metric: name, unit: 'lb', total: false, ...planMetrics[name],
  }));
  if (athlete.value !== 'jr') return training;
  const phase = currentPhase();
  const strength = (phase.workouts[day.value] ?? []).map(({name, target, unit, block}) => ({
    name, target, block, metric: planMetrics[name]?.metric ?? name, unit: unit || planMetrics[name]?.unit || 'lb', total: false,
    phaseId: phase.id, phaseName: phase.name,
  }));
  return [...strength, ...training];
}

function resultValue(result) {
  if (result.unit === 'done') return 'Completed';
  if (result.unit === 'in') {
    const feet = Math.floor(result.value / 12);
    const inches = Number((result.value % 12).toFixed(2));
    return `${feet} ft ${fmt(inches)} in`;
  }
  if (result.unit === 'lb-yd') return `${fmt(result.value)} lb × ${fmt(result.distance)} yd`;
  if (result.unit === 'lb' && result.value === 0) return 'Bodyweight';
  return [fmt(result.value), result.unit].filter(Boolean).join(' ');
}

const checklistStates = ['From logs', 'Done', 'Partial', 'Skipped'];
const benchmarkMetrics = [
  {name: 'Tee exit velocity', unit: 'mph', context: 'Off a tee. Use the same bat, ball, and radar setup.'},
  {name: 'Mound fastball velocity', unit: 'mph', context: 'Fastball from a mound. Use the same radar setup.'},
  {name: 'Home to first (90 ft)', unit: 'sec', context: '90-foot bases. Use the same timing method and start cue.', lower: true},
];

function checklistId(exercise) {
  const identity = ['checklist', planDate, day.value, exercise.phaseId || '', exercise.metric];
  if (exercise.block) identity.push(exercise.block);
  return JSON.stringify(identity);
}

function checklistState(exercise, entries) {
  const manual = records.find(record => record.id === checklistId(exercise));
  if (manual?.value && checklistStates[manual.value]) return checklistStates[manual.value];
  if (!entries.length) return 'To do';
  const sets = Number(exercise.target?.match(/^(\d+)\s*(?:[×x]|sets?\b)/i)?.[1] || 0);
  const loggedSets = entries.reduce((total, record) => total + (Number(record.sets) || 1), 0);
  return exercise.phaseId && sets && loggedSets < sets ? 'Partial' : 'Done';
}

function saveChecklist(exercise, value) {
  const id = checklistId(exercise);
  const next = readRecords().filter(record => record.id !== id);
  if (value) {
    next.push({id, athlete: 'jr', date: planDate, metric: exercise.metric, unit: 'status', value});
  }
  localStorage.setItem(key, JSON.stringify(next));
  records = next;
}

function currentWeek() {
  const monday = new Date();
  monday.setDate(monday.getDate() - (monday.getDay() + 6) % 7);
  return Array.from({length: 7}, (_, index) => {
    const date = new Date(monday);
    date.setDate(monday.getDate() + index);
    return {
      date: localDate(date),
      label: date.toLocaleDateString('en-US', {weekday: 'short', month: 'short', day: 'numeric'}),
    };
  });
}

function renderJrProgress(own) {
  const week = currentWeek();
  const training = own.filter(record => !['Body weight', 'Height'].includes(record.metric));
  const weekly = training.filter(record => record.date >= week[0].date && record.date <= week[6].date);
  const sum = (metric) => weekly.filter(record => record.metric === metric).reduce((total, record) => total + record.value, 0);
  const markedDays = records.filter(record => record.athlete === 'jr' && record.unit === 'status' &&
    record.value === 1 && record.date >= week[0].date && record.date <= week[6].date);
  const days = new Set([...weekly, ...markedDays].map(record => record.date)).size;
  const sets = weekly.filter(record => record.phaseId && ['lb','lb-yd'].includes(record.unit)).reduce((total, record) => total + (Number(record.sets) || 1), 0);
  const armCare = weekly.filter(record => record.unit === 'done' && record.metric.startsWith('Arm care:')).length;
  const lifts = own.filter(record => record.phaseId && ['lb','lb-yd'].includes(record.unit)).sort((a, b) => b.date.localeCompare(a.date));
  const recentLifts = [...new Set(lifts.map(record => record.metric))].slice(0, 3);
  const describeSet = record => `${resultValue(record)}${record.reps ? ` × ${record.reps} reps` : ''}`;

  return `<div class="panel">
    <h2>My Progress · This week</h2><p>${week[0].label} – ${week[6].label}</p>
    <div class="grid">${[['Training days logged', days], ['Strength sets', sets], ['Swings', sum('Hitting reps')], ['Fielding reps', sum('Fielding reps')], ['Arm care drills', armCare]].map(([label, value]) =>
      `<div class="stat"><span>${label}</span><strong>${fmt(value)}</strong></div>`).join('')}</div>
  </div>
  <div class="panel"><h2>Recent strength work</h2>
    ${recentLifts.length ? recentLifts.map(metric => {
      const history = lifts.filter(record => record.metric === metric);
      const last = history[0];
      const topSet = date => history.filter(record => record.date === date && record.unit === last.unit)
        .reduce((best, record) => record.value > best.value ||
          (record.value === best.value && Number(record.reps) > Number(best.reps)) ? record : best);
      const previous = history.find(record => record.date < last.date && record.unit === last.unit);
      return `<div class="entry"><b>${esc(metric)}</b>
        <div>Latest session · ${esc(describeSet(topSet(last.date)))}</div>
        ${previous ? `<div class="hint">Previous session · ${esc(describeSet(topSet(previous.date)))}</div>` : ''}
      </div>`;
    }).join('') : '<p>Log a strength set to start tracking your lifts.</p>'}
  </div>
  <div class="panel"><h2>Baseball benchmarks</h2>
    ${benchmarkMetrics.map(({name, unit, context, lower}) => {
      const entries = own.filter(record => record.metric === name && record.value > 0).sort((a, b) => a.date.localeCompare(b.date));
      if (!entries.length) return `<div class="entry"><b>${name}</b><small>Log a test to set your baseline.</small><div class="hint">${context}</div></div>`;
      const first = entries[0];
      const latest = entries.at(-1);
      const best = entries.reduce((best, record) => (lower ? record.value < best.value : record.value > best.value) ? record : best);
      const delta = Number((latest.value - first.value).toFixed(2));
      const result = record => `${fmt(record.value)} ${unit}`;
      return `<div class="entry"><b>${name}</b><div>Latest ${result(latest)} · ${esc(latest.date)}</div>
        <div class="hint">Baseline ${result(first)} · Best ${result(best)} · Change ${delta > 0 ? '+' : ''}${fmt(delta)} ${unit}</div>
        <div class="hint">${context}</div></div>`;
    }).join('')}
  </div>`;
}

function updatePlanStatus(form, exercise, saved = false) {
  const history = activeRecords().filter(record => record.metric === exercise.metric);
  const entries = history.filter(record => record.date === planDate &&
    (!exercise.phaseId || !record.phaseId || record.phaseId === exercise.phaseId) &&
    (!exercise.block || !record.block || record.block === exercise.block));
  const last = entries.at(-1);
  const completed = exercise.unit === 'done';
  const previous = completed ? null : history
    .filter(record => record.date < planDate)
    .sort((a, b) => a.date.localeCompare(b.date))
    .at(-1);
  const describe = record => `${resultValue(record)}${record.reps ? ` × ${record.reps} reps` : ''}`;
  const count = entries.reduce((sum, record) => sum + (Number(record.sets) || 1), 0);
  const today = last
    ? completed ? 'Completed' : `Last logged: ${describe(last)}${exercise.total ? '' : ` · ${count} ${count === 1 ? 'set' : 'sets'} logged`}`
    : '';
  const prior = previous ? `Previous session: ${describe(previous)}` : '';
  form.querySelector('.plan-status').textContent = [saved ? 'Saved.' : '', today, prior].filter(Boolean).join(' ');
  if (completed) form.querySelector('button').disabled = Boolean(last);
  const select = form.querySelector('select');
  if (athlete.value === 'jr' && select) {
    const manual = records.find(record => record.id === checklistId(exercise));
    select.value = String(manual?.value || 0);
    const status = checklistState(exercise, entries);
    const label = form.closest('details').querySelector('.checklist-state');
    label.textContent = status;
    label.dataset.state = status;
  }
}

function renderToday() {

  if (athlete.value === 'jr') bindPhaseControls();

    refreshTally();
  });
  forms.forEach((form, index) => {
    const exercise = exercises[index];
    const {metric, unit, total} = exercise;
    updatePlanStatus(form, exercise);
    if (junior) form.querySelector('select').addEventListener('change', event => {
      if (!dateInput.reportValidity()) {
        updatePlanStatus(form, exercise);
        return;
      }
      planDate = dateInput.value;
      try {
        saveChecklist(exercise, Number(event.target.value));
      } catch {
        updatePlanStatus(form, exercise);
        form.querySelector('.plan-status').textContent = 'Could not save this status. Try again.';
        return;
      }
      updatePlanStatus(form, exercise);
      refreshTally();
    });
    form.addEventListener('submit', event => {
      event.preventDefault();
      if (!dateInput.reportValidity()) return;
      planDate = dateInput.value;
      const completed = unit === 'done';
      const valueInput = form.elements.namedItem('value');
      const repsInput = form.elements.namedItem('reps');
      try {
        addResult({
          date: planDate,
          metric,
          unit,
          value: completed ? 1 : Number(valueInput.value),
          sets: completed || total ? '' : '1',
          reps: unit === 'lb-yd' ? '' : repsInput?.value || '',
          ...(unit === 'lb-yd' ? {distance: Number(repsInput.value)} : {}),
          ...(exercise.block ? {block: exercise.block} : {}),
          notes: '',
          ...(exercise.phaseId ? {phaseId: exercise.phaseId, phaseName: exercise.phaseName} : {}),
        });
      } catch {
        form.querySelector('.plan-status').textContent = 'Could not save. Check your browser storage and try again.';
        return;
      }
      updatePlanStatus(form, exercise, true);
      refreshTally();
      // Keep the weight available for the next set.
      if (repsInput) repsInput.value = '';
      else if (valueInput) valueInput.value = '';
    });
  });
  refreshTally();
}

const checkInMetrics = [
  {metric: 'Body weight', name: 'Weight', unit: 'lb'},
  {metric: 'Height', name: 'Height', unit: 'in'},
];
const jrWeightGoal = {value: 125, date: '2026-12-11'};

function sortedMeasurements(metric) {
  const byDate = new Map();
  for (const record of activeRecords()) {
    if (record.metric === metric && Number.isFinite(record.value) && record.value > 0) {
      byDate.set(record.date, record);
    }
  }
  return [...byDate.values()].sort((a, b) => a.date.localeCompare(b.date));
}

function saveCheckIn(date, measurements) {
  const next = readRecords();
  for (const {metric, unit, value} of measurements) {
    // Keep older manual entries and update only check-ins saved by this form.
    const id = `check-in:jr:${date}:${metric}`;
    const entry = {id, athlete: 'jr', date, metric, unit, value, sets: '', reps: '', notes: ''};
    const index = next.findIndex(record => record.id === id);
    if (index < 0) next.push(entry);
    else next.splice(index, 1, entry);
  }
  localStorage.setItem(key, JSON.stringify(next));
  records = next;
}

function measurementSummary({metric, name, unit}) {
  const entries = sortedMeasurements(metric);
  const first = entries[0];
  const latest = entries.at(-1);
  const change = latest && first ? Number((latest.value - first.value).toFixed(2)) : 0;
  const recent = entries.slice(-8).reverse();
  return `<div class="panel">
    <h2>${name} history</h2>
    ${latest ? `<p>Latest <strong>${esc(resultValue({...latest, unit}))}</strong>
      ${entries.length > 1 ? ` · ${change > 0 ? '+' : ''}${fmt(change)} ${unit} since ${esc(first.date)}` : ''}</p>
      <ul class="measurement-list">${recent.map(record => `<li><time datetime="${esc(record.date)}">${esc(record.date)}</time>
        <strong>${esc(resultValue({...record, unit}))}</strong></li>`).join('')}</ul>` : '<p>No check-ins yet.</p>'}
  </div>`;
}

function renderCheckIn(date = localDate(), message = '') {
  const latestWeight = sortedMeasurements('Body weight').at(-1);
  const goalDate = new Date(`${jrWeightGoal.date}T12:00:00`).toLocaleDateString('en-US', {month: 'short', day: 'numeric', year: 'numeric'});
  const onDate = new Map(checkInMetrics.map(({metric}) => [metric, sortedMeasurements(metric).find(record => record.date === date)]));
  const weight = onDate.get('Body weight')?.value ?? '';

  const feet = height ? Math.floor(height / 12) : '';

    <h2>Phil Jr. · Weight & height</h2>
    <div class="stat"><span>Weight goal · ${goalDate}</span><strong>${jrWeightGoal.value} lb</strong>

        <div><label for="checkin-inches">Inches</label>
          <input id="checkin-inches" type="number" inputmode="decimal" min="0" max="11.99" step="any" value="${esc(inches)}"></div>

  ${checkInMetrics.map(measurementSummary).join('')}`;

  $('checkin-date').addEventListener('change', event => {
    if (event.target.checkValidity()) renderCheckIn(event.target.value);
  });

    event.preventDefault();

    const feetInput = $('checkin-feet').value;

    const entries = [];

    } catch {
      $('checkin-status').textContent = 'Could not save. Check your browser storage and try again.';
      return;
    }
    renderCheckIn(dateInput, 'Check-in saved.');
  });

if(tab==='progress'&&metrics.length)drawChart(metrics[0]);if(tab==='log')$('resultForm').addEventListener('submit',e=>{e.preventDefault();const r={date:$('date').value,metric:$('metric').value,unit:benchmarkMetrics.find(({name})=>name===$('metric').value)?.unit,value:Number($('value').value),sets:$('sets').value,reps:$('reps').value,notes:$('notes').value};if(!r.date||!Number.isFinite(r.value))return;if(r.unit&&r.value<=0){alert('Enter a result greater than zero.');return}try{addResult(r)}catch{alert('Could not save this result');return}tab='progress';render()});if(tab==='progress'&&metrics.length)$('chartMetric').onchange=e=>drawChart(e.target.value);if(tab==='history'){document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Delete this entry?')){records=records.filter(r=>r.id!==b.dataset.delete);save();render()}});$('export').onclick=()=>{const blob=new Blob([JSON.stringify({app:'Taveras Performance',version:1,records,phases:readPhases()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='taveras-performance-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!Array.isArray(obj.records)||obj.records.length>50000)throw Error('Invalid backup');const valid=obj.records.filter(r=>r&&typeof r.id==='string'&&['sr','jr'].includes(r.athlete)&&/^\d{4}-\d{2}-\d{2}$/.test(r.date)&&typeof r.metric==='string'&&r.metric.length<100&&typeof r.value==='number'&&Number.isFinite(r.value));const ids=new Set(records.map(r=>r.id));valid.forEach(r=>{if(!ids.has(r.id)){records.push({id:r.id,athlete:r.athlete,date:r.date,metric:r.metric,value:r.value,unit:['lb','reps','sec','done','in','mph','status','yd','lb-yd'].includes(r.unit)?r.unit:undefined,sets:String(r.sets||'').slice(0,10),reps:String(r.reps||'').slice(0,10),notes:String(r.notes||'').slice(0,250),phaseId:typeof r.phaseId==='string'?r.phaseId.slice(0,80):undefined,phaseName:typeof r.phaseName==='string'?r.phaseName.slice(0,48):undefined,block:typeof r.block==='string'?r.block.slice(0,100):undefined,distance:Number.isFinite(r.distance)?r.distance:undefined});ids.add(r.id)}});save();importPhases(obj.phases);render();alert('Backup imported')}catch{alert('Could not import this backup')}}}}
function drawChart(metric){const arr=activeRecords().filter(r=>r.metric===metric).sort((a,b)=>a.date.localeCompare(b.date)).slice(-8),max=Math.max(...arr.map(r=>r.value),1);$('chartArea').innerHTML=arr.length?`<div class="bars">${arr.map(r=>`<div class="bar" title="${esc(r.date)}: ${esc(r.value)}" style="height:${Math.max(3,r.value/max*100)}%"></div>`).join('')}</div><div class="barlabels">${arr.map(r=>`<span>${esc(r.date.slice(5))}</span>`).join('')}</div><p class="hint">${esc(metric)} · ${arr.length} most recent entries. For sprint times, lower is better.</p>`:'<p>No data.</p>'}
athlete.onchange=render;day.onchange=()=>{
  if(athlete.value==='jr')planDate=currentWeek()[DAYS.indexOf(day.value)].date;
  render();
};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
